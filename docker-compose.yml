services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      # host.docker.internal reaches Ollama running on your Mac
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: llama3.1:latest
      OTEL_ENDPOINT: http://otel-collector:4317
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports: ["3000:3000"]
    depends_on: [prometheus]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./deploy/observability/otel-collector.yaml:/etc/otel.yaml:ro"]
    ports: ["4317:4317"]

volumes:
  pgdata:
