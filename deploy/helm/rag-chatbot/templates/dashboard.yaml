{{- if .Values.dashboard.enabled }}
# The dashboard ships with the chart rather than being clicked together in the
# UI, so it is reviewable, versioned, and survives Grafana being recreated.
# kube-prometheus-stack runs a sidecar that watches every namespace for
# ConfigMaps carrying the grafana_dashboard label and imports what it finds --
# which is why the label below is the whole integration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-chatbot.fullname" . }}-dashboard
  labels:
    {{- include "rag-chatbot.labels" . | nindent 4 }}
    {{ .Values.dashboard.sidecarLabel }}: "1"
  annotations:
    k8s-sidecar-target-directory: {{ .Values.dashboard.folder | quote }}
data:
  rag-chatbot.json: |-
{{ .Files.Get "dashboards/rag-chatbot.json" | indent 4 }}
{{- end }}
