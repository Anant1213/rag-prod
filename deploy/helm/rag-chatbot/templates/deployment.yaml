apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-chatbot.fullname" . }}
  labels: {{- include "rag-chatbot.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {{- include "rag-chatbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rag-chatbot.selectorLabels" . | nindent 8 }}
      annotations:
        # roll pods when config changes, otherwise a ConfigMap edit silently does nothing
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: {{ include "rag-chatbot.fullname" . }}}
            - secretRef: {name: {{ include "rag-chatbot.fullname" . }}}
          # liveness must not depend on Postgres, or a DB blip restarts every pod
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          # readiness does check dependencies, so a broken pod leaves the Service
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          # startup probe covers the embedding model load
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: ["ALL"]}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "rag-chatbot.selectorLabels" . | nindent 14 }}
