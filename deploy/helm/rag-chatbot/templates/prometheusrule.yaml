{{- if .Values.prometheusRule.enabled }}
# Alerts on what a user actually experiences, not on what is easy to measure.
# Same label selector story as the ServiceMonitor: the Prometheus operator only
# adopts rules whose labels match its ruleSelector, so an unlabelled rule is
# silently ignored rather than rejected.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "rag-chatbot.fullname" . }}
  labels:
    {{- include "rag-chatbot.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: rag-chatbot
      rules:
        # The SLI. Streaming hides total latency, so the number that matters is
        # how long the page sits blank before the first token lands.
        - alert: RagTimeToFirstTokenSlow
          expr: >-
            histogram_quantile(0.95, sum by (le) (
              rate(rag_time_to_first_token_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m])
            )) > {{ .Values.prometheusRule.ttftP95Seconds }}
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "p95 time to first token above {{ .Values.prometheusRule.ttftP95Seconds }}s"
            description: >-
              Users wait {{ `{{ $value | humanizeDuration }}` }} before any text appears.
              Check the retrieval-latency panel first: if rerank is flat, the model
              provider is the cause rather than retrieval.

        # Errors are upstream model failures surfaced as SSE error events.
        # Refusals are deliberate and deliberately excluded here.
        - alert: RagErrorRateHigh
          expr: >-
            sum(rate(rag_requests_total{namespace="{{ .Release.Namespace }}", outcome="error"}[5m]))
            /
            clamp_min(sum(rate(rag_requests_total{namespace="{{ .Release.Namespace }}"}[5m])), 0.0001)
            > {{ .Values.prometheusRule.errorRatio }}
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Chat error ratio above {{ .Values.prometheusRule.errorRatio }}"
            description: >-
              {{ `{{ $value | humanizePercentage }}` }} of requests are failing upstream.

        # Every query matching zero chunks means the corpus is gone, not that the
        # questions got harder. This is the alert that catches a lost volume or a
        # failed ingest before anyone reports bad answers.
        - alert: RagRetrievingNothing
          expr: >-
            sum(rate(rag_empty_retrieval_total{namespace="{{ .Release.Namespace }}"}[10m])) > 0
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: "Retrieval is returning no chunks"
            description: "Queries are matching nothing. Check the corpus is present and the ingest Job succeeded."

        - alert: RagNotReady
          expr: max(rag_ready{namespace="{{ .Release.Namespace }}"}) < 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "No ready rag-chatbot pod"
            description: "Every replica reports its dependencies unhealthy."
{{- end }}
