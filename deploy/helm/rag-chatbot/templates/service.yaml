apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-chatbot.fullname" . }}
  labels: {{- include "rag-chatbot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector: {{- include "rag-chatbot.selectorLabels" . | nindent 4 }}
