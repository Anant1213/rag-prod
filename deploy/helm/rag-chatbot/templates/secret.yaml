{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-chatbot.fullname" . }}
  labels: {{- include "rag-chatbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  LLM_API_KEY: {{ .Values.secret.llmApiKey | quote }}
{{- end }}
