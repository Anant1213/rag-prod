replicaCount: 2

image:
  repository: ghcr.io/anant1213/rag-prod
  tag: "8fa6317dc12e1128708e6edc14a973263d604568"
  pullPolicy: IfNotPresent

service:
  port: 8000

env:
  LLM_BASE_URL: "http://host.k3d.internal:11434/v1"
  LLM_MODEL: "llama3.1:latest"
  OTEL_ENDPOINT: ""
  LOG_LEVEL: "INFO"

# In real clusters this comes from External Secrets / Vault, never from values.yaml
secret:
  create: true
  databaseUrl: "postgresql://rag:rag@postgres.data.svc.cluster.local:5432/rag"
  llmApiKey: "not-needed"

resources:
  requests: {cpu: "500m", memory: "1Gi"}
  limits: {memory: "2Gi"}          # no CPU limit: throttling an inference gateway is self-harm

# Grafana dashboard, delivered as a ConfigMap the Grafana sidecar picks up.
dashboard:
  enabled: true
  sidecarLabel: grafana_dashboard
  folder: /tmp/dashboards

# Alert rules. `labels` must match the operator's ruleSelector or the rules are
# adopted by nothing and fail silently -- the same trap the ServiceMonitor hit.
prometheusRule:
  enabled: true
  labels:
    release: kps
  ttftP95Seconds: 4
  errorRatio: 0.05

# Corpus ingest, run as an Argo CD PostSync hook. Documents come from git, not
# from the application image, so the image stays small and the corpus stays
# reproducible after a lost volume.
ingest:
  enabled: true
  repo: https://github.com/Anant1213/rag-prod.git
  revision: main
  path: docs
  gitImage: alpine/git:2.45.2
  psqlImage: pgvector/pgvector:pg16
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

autoscaling:
  enabled: true
  minReplicas: 2
  # Ceiling set by the host, not by ambition. Every k3d node container reports
  # the whole Docker VM's memory as allocatable, so a 3-node cluster on a 7.75Gi
  # VM advertises ~23Gi and the scheduler will cheerfully place 10 pods that
  # request 1Gi each. It did: load drove the HPA to 10, the VM ran out of memory
  # for real, and the control-plane node went NotReady. The scheduler cannot see
  # this -- the number has to come from what the machine actually has.
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true                     # requires kube-prometheus-stack CRDs
  interval: 15s
  # Must match the Prometheus serviceMonitorSelector, or the ServiceMonitor is
  # created and silently ignored. kube-prometheus-stack selects on the release
  # name it was installed under (`kps` in deploy/k3d/bootstrap.sh).
  labels:
    release: kps
