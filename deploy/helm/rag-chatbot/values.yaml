replicaCount: 2

image:
  repository: ghcr.io/anant1213/rag-prod
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8000

env:
  LLM_BASE_URL: "http://litellm.llm.svc.cluster.local:4000/v1"
  LLM_MODEL: "llama3.1:latest"
  OTEL_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  LOG_LEVEL: "INFO"

# In real clusters this comes from External Secrets / Vault, never from values.yaml
secret:
  create: true
  databaseUrl: "postgresql://rag:rag@postgres.data.svc.cluster.local:5432/rag"
  llmApiKey: "not-needed"

resources:
  requests: {cpu: "500m", memory: "1Gi"}
  limits: {memory: "2Gi"}          # no CPU limit: throttling an inference gateway is self-harm

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true                     # requires kube-prometheus-stack CRDs
  interval: 15s
