name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  quality-and-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      # provides a non-externally-managed interpreter; the runner's /usr python
      # is PEP 668 marked, which makes `uv pip install --system` fail outright.
      # 3.12 also matches the Dockerfile, so CI and the image agree.
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -r pyproject.toml --extra dev
      - run: ruff check .
      - name: Apply schema
        run: psql "$DATABASE_URL" -f scripts/init_db.sql
      - name: Ingest corpus
        run: python -m scripts.ingest docs/
      - name: Eval gate
        run: python -m eval.run_eval      # non-zero exit blocks the merge

  image:
    needs: quality-and-eval
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      # OCI repository names must be lowercase, but github.repository preserves
      # the owner's casing, so it cannot be interpolated into a tag directly.
      - id: img
        run: echo "ref=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.img.outputs.ref }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.ref }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          # Only fail on vulnerabilities that can actually be acted on. The
          # python:3.12-slim base currently carries 53 HIGH/CRITICAL findings
          # with no fixed version published, so gating on unfixed CVEs makes
          # the build permanently red with no developer action available.
          ignore-unfixed: true
          exit-code: "1"
